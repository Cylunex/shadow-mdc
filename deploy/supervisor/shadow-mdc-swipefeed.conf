[program:shadow-mdc-swipefeed]
directory=/data/project/shadow-mdc/current/services/swipefeed
command=/usr/local/bin/node src/server.js
environment=PORT="8791",HOST="127.0.0.1",NODE_ENV="production",SWIPEFEED_BASE="",SWIPEFEED_BROWSER_API_PREFIX="/api/swipe",SWIPEFEED_DATA_DIR="/data/project/shadow-mdc/shared/data/swipefeed",PROXY_URL="http://192.168.0.110:7893",HTTPS_PROXY="http://192.168.0.110:7893",HTTP_PROXY="http://192.168.0.110:7893"
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
